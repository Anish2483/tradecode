<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tradecode</title>
    <!-- GitHub Pages SPA 404 redirect — rafgraph/spa-github-pages technique -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      // If we're at the repo root with nothing after it, just go to index
      var pathParts = l.pathname.split('/').filter(Boolean);
      if (pathParts.length <= pathSegmentsToKeep) {
        // We're at the base path (e.g. /tradecode/), redirect cleanly
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + pathParts.slice(0, pathSegmentsToKeep).join('/') + '/');
      } else {
        // We're on a sub-route, encode it into query string for index.html to decode
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/' + pathParts.slice(0, pathSegmentsToKeep).join('/') + '/?/' +
          pathParts.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body></body>
</html>
